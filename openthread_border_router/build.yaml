---
# Base image is the official prebuilt OTBR app image, so the local build is
# just a small layer copy (~10-30 s) instead of a 20-40 min OpenThread compile.
#
# Keep this tag in sync with the upstream app version you want to track:
#   https://hub.docker.com/r/homeassistant/amd64-addon-otbr/tags
build_from:
  aarch64: homeassistant/aarch64-addon-otbr:3.3.0
  amd64: homeassistant/amd64-addon-otbr:3.3.0
# The build args below were only needed for the from-source build and are
# no longer consumed. They are kept (commented) for reference.
# args:
#   OTBR_BETA_VERSION: cb4bdae242b22287cded07ae3aa10347c2d16d9b
#   OTBR_VERSION: fd872ab9d4afdfaf034b3b1154fed08b8b6d1e43
#   UNIVERSAL_SILABS_FLASHER_VERSION: 0.1.2
#   SERIALX_VERSION: 1.8.0
